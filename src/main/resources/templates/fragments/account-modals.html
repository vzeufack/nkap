<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<body>
<!--
  Add / Edit Account modals, shared by the budget and transactions pages.
  Both expect ${financialInstitutions}; logic lives in /js/nkap-accounts.js.
-->

<!-- ══ Add Account Modal ══ -->
<div class="modal fade" id="addAccountModal" th:fragment="add-account-modal" tabindex="-1" role="dialog"
     aria-labelledby="accountModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content nkap-modal">
            <div class="modal-header nkap-modal-header">
                <div class="modal-title-wrap">
                    <div class="modal-icon-circle">
                        <i class="fas fa-university"></i>
                    </div>
                    <h5 class="modal-title bree-serif" id="accountModalTitle">New Account</h5>
                </div>
                <button type="button" class="close nkap-modal-close" data-dismiss="modal" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body nkap-modal-body">
                <div class="form-group mb-3">
                    <label class="nkap-input-label" for="accountNameInput">Account Name</label>
                    <input type="text" id="accountNameInput" class="form-control nkap-input"
                           placeholder="e.g. Checking, Savings, Wallet…" maxlength="100" autocomplete="off"/>
                    <div class="invalid-feedback" id="accountNameError"></div>
                </div>
                <div class="form-group mb-3">
                    <label class="nkap-input-label" for="accountTypeSelect">Account Type</label>
                    <select id="accountTypeSelect" class="form-control nkap-input">
                        <option value="CHECKING">Checking</option>
                        <option value="SAVINGS">Savings</option>
                        <option value="CASH">Cash</option>
                        <option value="CREDIT">Credit</option>
                    </select>
                    <div class="invalid-feedback" id="accountTypeError"></div>
                </div>
                <div class="form-group mb-3">
                    <label class="nkap-input-label" for="accountFinancialInstitutionSelect">Financial Institution</label>
                    <select id="accountFinancialInstitutionSelect" class="form-control nkap-input">
                        <option value="">None</option>
                        <option th:each="fi : ${financialInstitutions}"
                                th:value="${fi.id}"
                                th:text="${fi.displayName}">Bank of America</option>
                    </select>
                    <div class="invalid-feedback" id="accountFinancialInstitutionError"></div>
                </div>
                <div class="form-group mb-0">
                    <label class="nkap-input-label" for="accountBalanceInput">Opening Balance</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text nkap-input-prefix">$</span>
                        </div>
                        <input type="number" id="accountBalanceInput" class="form-control nkap-input"
                               placeholder="0.00" step="0.01" autocomplete="off"/>
                    </div>
                    <div class="invalid-feedback d-block" id="accountBalanceError"></div>
                </div>
            </div>
            <div class="modal-footer nkap-modal-footer">
                <button type="button" class="btn btn-modal-cancel" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-modal-save" id="btnSaveAccount" onclick="saveAccount()">
                    <span id="btnSaveAccountSpinner" class="spinner-border spinner-border-sm mr-2 d-none" role="status"></span>
                    <i class="fas fa-check mr-2" id="btnSaveAccountIcon"></i>
                    Save Account
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ══ Edit Account Modal ══ -->
<div class="modal fade" id="editAccountModal" th:fragment="edit-account-modal" tabindex="-1" role="dialog"
     aria-labelledby="editAccountModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content nkap-modal">
            <div class="modal-header nkap-modal-header">
                <div class="modal-title-wrap">
                    <div class="modal-icon-circle">
                        <i class="fas fa-pen"></i>
                    </div>
                    <h5 class="modal-title bree-serif" id="editAccountModalTitle">Edit Account</h5>
                </div>
                <button type="button" class="close nkap-modal-close" data-dismiss="modal" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body nkap-modal-body">
                <input type="hidden" id="editAccountId"/>
                <div class="form-group mb-3">
                    <label class="nkap-input-label" for="editAccountNameInput">Account Name</label>
                    <input type="text" id="editAccountNameInput" class="form-control nkap-input"
                           placeholder="e.g. Checking, Savings, Wallet…" maxlength="100" autocomplete="off"/>
                    <div class="invalid-feedback" id="editAccountNameError"></div>
                </div>
                <div class="form-group mb-3">
                    <label class="nkap-input-label" for="editAccountTypeSelect">Account Type</label>
                    <select id="editAccountTypeSelect" class="form-control nkap-input">
                        <option value="CHECKING">Checking</option>
                        <option value="SAVINGS">Savings</option>
                        <option value="CASH">Cash</option>
                        <option value="CREDIT">Credit</option>
                    </select>
                    <div class="invalid-feedback" id="editAccountTypeError"></div>
                </div>
                <div class="form-group mb-3">
                    <label class="nkap-input-label" for="editAccountFinancialInstitutionSelect">Financial Institution</label>
                    <select id="editAccountFinancialInstitutionSelect" class="form-control nkap-input">
                        <option value="">None</option>
                        <option th:each="fi : ${financialInstitutions}"
                                th:value="${fi.id}"
                                th:text="${fi.displayName}">Bank of America</option>
                    </select>
                    <div class="invalid-feedback" id="editAccountFinancialInstitutionError"></div>
                </div>
                <div class="form-group mb-0">
                    <label class="nkap-input-label" for="editAccountBalanceInput">Balance</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text nkap-input-prefix">$</span>
                        </div>
                        <input type="number" id="editAccountBalanceInput" class="form-control nkap-input"
                               placeholder="0.00" step="0.01" autocomplete="off"/>
                    </div>
                    <div class="invalid-feedback d-block" id="editAccountBalanceError"></div>
                </div>
            </div>
            <div class="modal-footer nkap-modal-footer">
                <button type="button" class="btn btn-modal-cancel" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-modal-save" id="btnUpdateAccount" onclick="updateAccount()">
                    <span id="btnUpdateAccountSpinner" class="spinner-border spinner-border-sm mr-2 d-none" role="status"></span>
                    <i class="fas fa-check mr-2" id="btnUpdateAccountIcon"></i>
                    Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
