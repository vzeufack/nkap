<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<body>
<div class="tx-table-panel" th:fragment="transactions-table"
     th:with="txPage=${transactionsPage}">

    <div class="tx-table-empty" th:if="${txPage.totalElements == 0}">
        <i class="fas fa-receipt"></i>
        <span th:if="${filter.isDefault()}"
              th:text="'No transactions for ' + ${rangeLabel} + '.'">No transactions for this period.</span>
        <th:block th:unless="${filter.isDefault()}">
            <span th:text="'No transactions match these filters (' + ${rangeLabel} + ').'">No transactions match these filters.</span>
            <a href="/transactions" class="tx-table-empty-reset">Reset filters</a>
        </th:block>
    </div>

    <th:block th:if="${txPage.totalElements > 0}"
              th:with="hasSelectable=${!txPage.content.?[transactionType.name() == 'STANDARD'].isEmpty()}">
        <!-- Shown by nkap-transactions-page.js while rows are selected. Selection covers the
             current page only and is cleared whenever the table is swapped. -->
        <div class="tx-bulk-bar" id="txBulkBar" hidden>
            <span class="tx-bulk-count" id="txBulkCount">0 selected</span>
            <button type="button" class="btn tx-bulk-delete" id="btnBulkDelete">
                <span id="btnBulkDeleteSpinner" class="spinner-border spinner-border-sm mr-1 d-none" role="status"></span>
                <i class="fas fa-trash-alt mr-1" id="btnBulkDeleteIcon"></i> Delete selected
            </button>
            <button type="button" class="btn tx-bulk-clear" id="btnBulkClear">Clear selection</button>
            <span class="tx-bulk-error" id="txBulkError"></span>
        </div>

        <div class="tx-table-scroll">
            <table class="table tx-table mb-0">
                <thead>
                    <tr>
                        <th scope="col" class="tx-table-select">
                            <input type="checkbox" id="txSelectAll" th:if="${hasSelectable}"
                                   title="Select all on this page" aria-label="Select all on this page"/>
                        </th>
                        <th scope="col" th:with="active=${filter.sort.name().startsWith('DATE')}">
                            <button type="button" class="tx-sort-toggle"
                                    th:classappend="${active} ? 'active' : ''"
                                    data-sort-desc="DATE_DESC" data-sort-asc="DATE_ASC"
                                    th:title="${active and filter.sort.name() == 'DATE_DESC'} ? 'Sort oldest first' : 'Sort newest first'">
                                Date
                                <i class="fas"
                                   th:classappend="${!active} ? 'fa-sort' : (${filter.sort.name() == 'DATE_DESC'} ? 'fa-sort-down' : 'fa-sort-up')"></i>
                            </button>
                        </th>
                        <th scope="col">Description</th>
                        <th scope="col"
                            th:with="active=${filter.sort.name().startsWith('AMOUNT')}">
                            <button type="button" class="tx-sort-toggle"
                                    th:classappend="${active} ? 'active' : ''"
                                    data-sort-desc="AMOUNT_DESC" data-sort-asc="AMOUNT_ASC"
                                    th:title="${active and filter.sort.name() == 'AMOUNT_DESC'} ? 'Sort smallest first' : 'Sort largest first'">
                                Amount
                                <i class="fas"
                                   th:classappend="${!active} ? 'fa-sort' : (${filter.sort.name() == 'AMOUNT_DESC'} ? 'fa-sort-down' : 'fa-sort-up')"></i>
                            </button>
                        </th>
                        <th scope="col">Type</th>
                        <th scope="col">Group</th>
                        <th scope="col">Category</th>
                        <th scope="col">Account Type</th>
                        <th scope="col">Account</th>
                        <th scope="col" class="tx-table-actions"><span class="sr-only">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${txPage.content}"
                        th:with="sign=${tx.direction.name() == 'DEBIT' ? '−' : '+'},
                                 amountText=${'$' + #numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">
                        <td class="tx-table-select">
                            <!-- Only standard transactions can be deleted, so only they're selectable. -->
                            <input type="checkbox" class="tx-select" th:if="${tx.transactionType.name() == 'STANDARD'}"
                                   th:value="${tx.id}" aria-label="Select transaction"/>
                        </td>
                        <td class="tx-table-date" th:text="${#temporals.format(tx.transactionDate, 'MMM d, yyyy')}">Jan 1, 2026</td>
                        <td class="tx-table-description"
                            th:text="${tx.description ?: '—'}"
                            th:title="${tx.description}">Description</td>
                        <td class="tx-table-amount"
                            th:classappend="${tx.direction.name() == 'CREDIT'} ? 'credit' : 'debit'"
                            th:text="${sign + amountText}">$0.00</td>
                        <td th:text="${tx.transactionTypeLabel}">Standard</td>
                        <td th:text="${tx.groupName ?: '—'}">Group</td>
                        <td th:text="${tx.categoryName ?: '—'}">Category</td>
                        <td th:text="${tx.accountTypeLabel ?: '—'}">Checking</td>
                        <td th:text="${tx.accountName ?: '—'}">Account</td>
                        <td class="tx-table-actions">
                            <button type="button" class="tx-action-btn tx-details-btn" title="View details"
                                    th:attr="data-date=${#temporals.format(tx.transactionDate, 'EEEE, MMMM d, yyyy')},
                                             data-amount=${sign + amountText},
                                             data-direction=${tx.direction.name()},
                                             data-type=${tx.transactionType.name()},
                                             data-description=${tx.description},
                                             data-note=${tx.note},
                                             data-group=${tx.groupName},
                                             data-category=${tx.categoryName},
                                             data-account=${tx.accountName},
                                             data-account-type=${tx.accountTypeLabel},
                                             data-budget=${#strings.capitalize(#strings.toLowerCase(tx.budgetMonth.name())) + ' ' + tx.budgetYear}">
                                <i class="fas fa-info-circle"></i>
                            </button>
                            <!-- Adjustments and transfers are system-generated (transfers come in linked pairs),
                                 so only standard transactions can be edited or deleted here. -->
                            <th:block th:if="${tx.transactionType.name() == 'STANDARD'}">
                                <button type="button" class="tx-action-btn tx-edit-btn" title="Edit transaction"
                                        onclick="openEditTransactionModal(this)"
                                        th:attr="data-id=${tx.id},
                                                 data-amount=${tx.amount},
                                                 data-type=${tx.direction.name()},
                                                 data-date=${#temporals.format(tx.transactionDate, 'yyyy-MM-dd')},
                                                 data-description=${tx.description},
                                                 data-note=${tx.note},
                                                 data-account-id=${tx.accountId},
                                                 data-category-id=${tx.categoryId}">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button type="button" class="tx-action-btn tx-delete-btn" title="Delete transaction"
                                        onclick="deleteTransaction(this)"
                                        th:attr="data-id=${tx.id}">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="tx-table-footer"
             th:with="first=${txPage.number * txPage.size + 1},
                      last=${txPage.number * txPage.size + txPage.numberOfElements},
                      startPage=${txPage.number - 2 > 0 ? txPage.number - 2 : 0},
                      endPage=${txPage.number + 2 < txPage.totalPages - 1 ? txPage.number + 2 : txPage.totalPages - 1}">
            <span class="tx-table-range"
                  th:text="${txPage.numberOfElements > 0} ? |Showing ${first}–${last} of ${txPage.totalElements} · ${rangeLabel}| : |${txPage.totalElements} transactions · ${rangeLabel}|">
                Showing 1–10 of 10
            </span>

            <nav aria-label="Transactions pages" th:if="${txPage.totalPages > 1}">
                <ul class="pagination tx-pagination mb-0">
                    <li class="page-item" th:classappend="${txPage.first} ? 'disabled' : ''">
                        <a class="page-link" aria-label="Previous"
                           th:href="${filter.pageUrl(txPage.number - 1)}"
                           th:attr="hx-get=${filter.pageUrl(txPage.number - 1)}"
                           hx-target="#transactions-table-container" hx-swap="innerHTML" hx-push-url="true">
                            <i class="fas fa-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${i == txPage.number} ? 'active' : ''">
                        <a class="page-link"
                           th:href="${filter.pageUrl(i)}"
                           th:attr="hx-get=${filter.pageUrl(i)}"
                           hx-target="#transactions-table-container" hx-swap="innerHTML" hx-push-url="true"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${txPage.last} ? 'disabled' : ''">
                        <a class="page-link" aria-label="Next"
                           th:href="${filter.pageUrl(txPage.number + 1)}"
                           th:attr="hx-get=${filter.pageUrl(txPage.number + 1)}"
                           hx-target="#transactions-table-container" hx-swap="innerHTML" hx-push-url="true">
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </th:block>
</div>
</body>
</html>
