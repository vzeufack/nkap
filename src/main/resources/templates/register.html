<!DOCTYPE html>
<html lang="en" xmlns:th = "http://thymeleaf.org">
<head>
	<title>Registration</title>
	<th:block th:replace="~{fragments/header :: css}"></th:block>
	<link rel="stylesheet" href="/css/budget-foundation.css"/>
	<link rel="stylesheet" href="/css/authentication.css"/>
</head>
<body class="auth-page">
	<div class="auth-shell">
		<div class="card auth-form-card">
			<h2 class="bree-serif">Create your account</h2>
			<p class="auth-lede">Start budgeting in minutes.</p>

			<form action = "/register" th:object="${appUserDTO}" method = "post">
			  <div class="auth-field" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
			    <label for="email">Email</label>
			    <input id="email" type="text" class="auth-input" th:field="*{email}"
               			th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
        		<div class="auth-field-error" th:if="${#fields.hasErrors('email')}"
         				th:text="${#fields.errors('email')[0]}"></div>
			  </div>
			  <div class="auth-field">
			    <label for="password">Password</label>
			    <input id="password" type="password" class="auth-input" th:field="*{password}"
               			th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
				<div class="auth-field-error" th:if="${#fields.hasErrors('password')}"
         				th:text="${#fields.errors('password')[0]}"></div>
			  </div>
			  <div id="errorMsg" class="auth-alert auth-alert-error" role="alert" th:if="${error}" th:text = "${error}"></div>
			  <button type="submit" class="btn-auth-submit bree-serif">Create Account</button>
			</form>

			<p class="auth-switch-link">Already have an account? <a href="/login">Log in</a></p>
		</div>

		<div th:replace="~{fragments/auth-showcase :: showcase}"></div>
	</div>

	<th:block th:replace="~{fragments/header :: scripts}"></th:block>
	<script src="/js/authentication.js"></script>
</body>
</html>
